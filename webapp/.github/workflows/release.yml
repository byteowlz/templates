name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (typecheck + lint + build)
        run: |
          bun run typecheck
          bun run lint
          bun run build

      - name: Package
        run: |
          cd dist
          tar -czf ../{{project_name}}-${{ env.RELEASE_TAG }}.tar.gz .
          cd ..
          shasum -a 256 {{project_name}}-${{ env.RELEASE_TAG }}.tar.gz > {{project_name}}-${{ env.RELEASE_TAG }}.tar.gz.sha256

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            {{project_name}}-${{ env.RELEASE_TAG }}.tar.gz
            {{project_name}}-${{ env.RELEASE_TAG }}.tar.gz.sha256

[build-system]
# uv native build backend (pure-Python projects). Upper bound required: it
# follows uv's versioning policy, and unbounded versions break future builds.
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[project]
name = "python-cli"
version = "0.1.0"
description = "Opinionated Python CLI template powered by Typer and uv."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.0",
  "platformdirs>=3.11.0",
  "pyyaml>=6.0.0",
  "tomli>=2.0.1; python_version < \"3.11\"",
  "tomli-w>=1.0.0",
]

[project.scripts]
python-cli = "python_cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-PyYAML>=6.0.12",
]

[tool.uv.build-backend]
# Package lives at the repo root (python_cli/), not under src/.
module-name = "python_cli"
module-root = ""

[tool.ruff.lint]
# Ruff's default set (E4/E7/E9/F) plus cyclomatic complexity (C90/mccabe)
select = ["E4", "E7", "E9", "F", "C90"]

[tool.ruff.lint.mccabe]
# Cyclomatic complexity guardrail - fail when a function exceeds this
max-complexity = 10
